<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - NHC Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background:
        linear-gradient(rgba(35, 28, 94, .58), rgba(35, 28, 94, .62)),
        url("nhc.png") center / cover fixed,
        linear-gradient(135deg, #8b7db2, #5f7fa5);
    }
    .reset-card {
      width: min(92vw, 520px);
      padding: 34px;
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(255,255,255,.76), rgba(255,255,255,.38));
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 28px 80px rgba(15,23,42,.28), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(34px) saturate(180%);
      -webkit-backdrop-filter: blur(34px) saturate(180%);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      color: #1e293b;
      font-weight: 800;
    }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      box-shadow: 0 10px 24px rgba(15,23,42,.12);
      object-fit: contain;
    }
    h1 {
      font-size: clamp(32px, 6vw, 46px);
      line-height: 1.05;
      letter-spacing: 0;
      margin-bottom: 12px;
      color: #172033;
    }
    .subtitle {
      color: #64748b;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .email-pill {
      display: inline-flex;
      max-width: 100%;
      padding: 5px 10px;
      border-radius: 999px;
      margin-top: 8px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.75);
      color: #2563eb;
      font-weight: 800;
      word-break: break-all;
    }
    .field {
      margin-bottom: 14px;
    }
    input {
      width: 100%;
      height: 56px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(255,255,255,.52);
      color: #0f172a;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 12px 30px rgba(15,23,42,.08);
      transition: .2s ease;
    }
    input:focus {
      border-color: rgba(59,130,246,.55);
      box-shadow: 0 0 0 5px rgba(59,130,246,.14), inset 0 1px 0 rgba(255,255,255,.9);
    }
    .hint {
      margin: 10px 0 20px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button, a.button-link {
      min-height: 52px;
      border: 0;
      border-radius: 17px;
      padding: 0 20px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: .2s ease;
    }
    .primary {
      flex: 1;
      color: white;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      box-shadow: 0 16px 30px rgba(79,70,229,.26);
    }
    .secondary {
      color: #334155;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.75);
    }
    button:hover, a.button-link:hover { transform: translateY(-1px); }
    button:disabled {
      cursor: not-allowed;
      opacity: .6;
      transform: none;
    }
    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }
    .message.show { display: block; }
    .message.error {
      color: #b91c1c;
      background: rgba(254,242,242,.62);
      border: 1px solid rgba(248,113,113,.38);
    }
    .message.success {
      color: #047857;
      background: rgba(236,253,245,.66);
      border: 1px solid rgba(52,211,153,.45);
    }
    .hidden { display: none; }
    .swal2-popup {
      border-radius: 30px !important;
      background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.45)) !important;
      border: 1px solid rgba(255,255,255,.72) !important;
      backdrop-filter: blur(30px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(30px) saturate(180%) !important;
    }
    @media (max-width: 520px) {
      .reset-card { padding: 26px 18px; }
      .actions { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <main class="reset-card">
    <div class="brand">
      <img src="logo.png" alt="NHC">
      <div>
        <div>NHC Library</div>
        <small style="color:#64748b;font-weight:700;">Đặt lại mật khẩu</small>
      </div>
    </div>

    <section id="formView">
      <h1>Mật khẩu mới</h1>
      <p class="subtitle">
        Link xác thực hợp lệ cho tài khoản:
        <span id="emailPill" class="email-pill">Đang kiểm tra...</span>
      </p>

      <form id="resetForm">
        <div class="field">
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="Mật khẩu mới" required>
        </div>
        <div class="field">
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" required>
        </div>
        <p class="hint">Mật khẩu cần có tối thiểu 8 ký tự, chữ in hoa, chữ số và ký tự đặc biệt.</p>
        <div class="actions">
          <button id="submitBtn" class="primary" type="submit">Đổi mật khẩu</button>
          <a class="button-link secondary" href="index.html">Về đăng nhập</a>
        </div>
      </form>
      <div id="messageBox" class="message"></div>
    </section>

    <section id="doneView" class="hidden">
      <h1>Hoàn tất</h1>
      <p class="subtitle">Mật khẩu của bạn đã được cập nhật. Bây giờ bạn có thể quay lại đăng nhập.</p>
      <div class="actions">
        <a class="button-link primary" href="index.html">Đăng nhập ngay</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgpPUYV5lqZ_5zUua8Q_ThNEIkPsEg2do",
      authDomain: "thuvien-44050.firebaseapp.com",
      projectId: "thuvien-44050",
      storageBucket: "thuvien-44050.firebasestorage.app",
      messagingSenderId: "926801895944",
      appId: "1:926801895944:web:72a42302cfc85a998da7bd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");

    const formView = document.getElementById("formView");
    const doneView = document.getElementById("doneView");
    const emailPill = document.getElementById("emailPill");
    const messageBox = document.getElementById("messageBox");
    const submitBtn = document.getElementById("submitBtn");

    function checkPasswordStrengthScore(value) {
      return [
        value.length >= 8,
        /[A-Z]/.test(value),
        /\d/.test(value),
        /[^A-Za-z0-9]/.test(value)
      ].filter(Boolean).length;
    }

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = `message ${type} show`;
    }

    async function initResetPage() {
      if (!oobCode) {
        emailPill.textContent = "Link không hợp lệ";
        showMessage("Link đặt lại mật khẩu không hợp lệ hoặc thiếu mã xác thực.");
        submitBtn.disabled = true;
        return;
      }

      try {
        const email = await verifyPasswordResetCode(auth, oobCode);
        emailPill.textContent = email;
      } catch (error) {
        emailPill.textContent = "Link hết hạn";
        showMessage("Link đặt lại mật khẩu đã hết hạn hoặc đã được sử dụng. Vui lòng yêu cầu gửi lại email mới.");
        submitBtn.disabled = true;
      }
    }

    document.getElementById("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      messageBox.className = "message";

      if (newPassword !== confirmPassword) {
        showMessage("Hai lần nhập mật khẩu mới chưa trùng nhau.");
        return;
      }

      if (checkPasswordStrengthScore(newPassword) < 4) {
        showMessage("Mật khẩu mới chưa đủ mạnh.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Đang cập nhật...";

      try {
        await confirmPasswordReset(auth, oobCode, newPassword);
        formView.classList.add("hidden");
        doneView.classList.remove("hidden");
      } catch (error) {
        showMessage("Không thể đổi mật khẩu. Link có thể đã hết hạn, vui lòng yêu cầu gửi lại email mới.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Đổi mật khẩu";
      }
    });

    initResetPage();
  </script>
</body>
</html>
